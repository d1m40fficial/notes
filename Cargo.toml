[package]
name = "plain"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "plain — минималистичный блокнот, переписанный на Rust/WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Storage",
  "Url",
  "Window",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
